<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gamenav.css">
  <title>海洋消消樂</title>
  <link rel="icon" href="../logo.PNG">
  <style>
    :root {
      /* 設定初始全域變數，隨後由 JS 動態動態調整 */
      --cell-size: 80px; 
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 30px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      width: 100%;
    }

    #scoreboard {
      width: 90%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
      margin-bottom: 15px;
      gap: 10px;
    }

    #mission {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 18px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(to bottom, #6ad6ff 0%, #2ba0ff 35%, #0b4fa3 100%);
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      animation: rise 6s linear infinite;
      pointer-events: none;
    }

    @keyframes rise {
      0% {
        transform: translateY(105vh) scale(0.5);
        opacity: 0.4;
      }
      50% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    h1 {
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0, 0, 50, 0.5);
      margin-bottom: 5px;
    }

    /* ⭐ 響應式遊戲主網格 */
    #grid {
      position: relative;
      width: calc(var(--cell-size) * 8);
      height: calc(var(--cell-size) * 8);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 50, 0.35);
      transition: transform .6s ease, opacity .6s ease;
      margin-bottom: 40px;
      touch-action: none; /* ⭐ 關鍵：防止手機拖曳時畫面跟著捲動滾動 */
      
      /* ⭐ 用漸層直接做響應式格線，捨棄原本寫死的 ::before box-shadow */
      background: 
        linear-gradient(to bottom, rgba(255, 255, 255, 0.12), rgba(0, 80, 160, 0.15)),
        linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 100% 100%, var(--cell-size) var(--cell-size), var(--cell-size) var(--cell-size);
    }

    /* 每個垃圾元素的容器 */
    .emoji {
      width: calc(var(--cell-size) * 0.85); /* 留一點內縮間距 */
      height: calc(var(--cell-size) * 0.85);
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: top .3s ease, left .3s ease, box-shadow .6s ease;
      border-radius: 12px;
      text-shadow: 0 1px 2px rgba(0, 0, 50, 0.5);
      touch-action: none; /* ⭐ 阻止手機預設手勢 */
    }
    
    /* 確保內層圖片隨格子響應式縮放 */
    .emoji img {
      width: 90% !important;
      height: 90% !important;
      object-fit: contain;
      pointer-events: none;
    }

    .target-glow {
      animation: glowPulse 1.5s infinite alternate;
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 6px 3px rgba(0, 200, 255, 0.3); }
      100% { box-shadow: 0 0 12px 6px rgba(0, 200, 255, 0.5); }
    }

    .cleared {
      opacity: 0;
      transform: scale(.5);
      transition: .3s;
    }

    /* ====== 全螢幕過場 ====== */
    #transition-text {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      font-weight: bold;
      text-shadow: 2px 2px 10px rgba(0, 0, 50, 0.7);
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: opacity .6s ease, transform .6s ease;
    }

    #transition-text span {
      font-size: 22px;
      margin-top: 8px;
      font-weight: normal;
      opacity: .9;
    }

    #level-transition {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: translateY(100%);
      z-index: 1000;
      pointer-events: none;
      opacity: 1;
      transition: opacity .8s ease;
    }

    #water-bg {
      position: absolute;
      bottom: -5%;
      left: 0;
      width: 100%;
      height: 105%;
      background: linear-gradient(to bottom, #6ad6ff 0%, #2ba0ff 40%, #0b4fa3 100%);
    }

    #overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      border-radius: 20px;
      pointer-events: none;
      transform: translateY(-100%);
      opacity: 0;
      transition: transform .6s ease, opacity .6s ease;
      text-shadow: 2px 2px 8px rgba(0, 0, 50, 0.5);
    }

    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #5dd5f5, #1e90ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3500;
      color: #fff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      transition: opacity .8s ease;
    }

    #start-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #start-screen h2 {
      font-size: 24px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 8px rgba(0, 0, 50, 0.5);
    }

    #start-title {
      font-family: 'Comfortaa', 'Noto Sans TC', sans-serif;
      font-size: 48px; /* 手機友善基礎大小 */
      font-weight: 700;
      color: #e8f7ff;
      letter-spacing: 2px;
      text-align: center;
      position: relative;
      filter: url(#waterWave);
      text-shadow:
        0 0 8px rgba(96, 198, 255, 0.6),
        0 0 15px rgba(52, 152, 219, 0.5),
        0 0 25px rgba(41, 128, 185, 0.35),
        0 4px 10px rgba(0, 40, 80, 0.4);
      animation: floatTitle 3s ease-in-out infinite;
    }

    @keyframes floatTitle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    #rules-container {
      background: rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 20px;
      width: 85%;
      max-width: 400px;
      text-align: left;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 50, 0.3);
      box-sizing: border-box;
    }

    #rules-container p {
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 18px;
    }

    #rules-container ul {
      margin: 0;
      padding-left: 20px;
      font-size: 15px;
      line-height: 1.6;
    }

    #rules-container li {
      margin-bottom: 8px;
    }

    #start-btn {
      padding: 12px 40px;
      font-size: 22px;
      border: none;
      border-radius: 12px;
      background: #00bfff;
      color: #fff;
      cursor: pointer;
      transition: all .3s;
      box-shadow: 0 5px 15px rgba(0, 0, 50, 0.4);
    }

    #start-btn:hover {
      background: #0099cc;
      transform: scale(1.05);
    }

    #finish-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 50, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 4000;
      color: #fff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #finish-screen h2 {
      font-size: 28px;
      margin-bottom: 30px;
      text-shadow: 2px 2px 10px rgba(0, 0, 50, 0.7);
    }

    #finish-screen button {
      margin: 10px;
      padding: 12px 25px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: #00bfff;
      color: #fff;
      cursor: pointer;
      transition: all .3s;
      box-shadow: 0 5px 15px rgba(0, 0, 50, 0.4);
    }

    /* =================================================== */
    /* ⭐ 消消樂頁面專屬 RWD 響應式中斷點 */
    /* =================================================== */
    @media screen and (min-width: 480px) {
      #start-title { font-size: 72px; }
      #start-screen h2 { font-size: 32px; }
      #rules-container p { font-size: 20px; }
      #rules-container ul { font-size: 18px; }
    }

    @media screen and (max-width: 768px) {
      body { padding-top: 100px; } /* 防止被上方縮小的 Logo 蓋到 */
      #scoreboard { font-size: 16px; }
      #mission { font-size: 15px; padding: 4px 10px; }
    }
  </style>
</head>

<body>
  <div id="logo-container">
    <img src="../logo.PNG" alt="Logo" id="logo-img">
    <span id="logo-text">海洋消消樂</span>
  </div>

  <div class="ui-top">
    <button id="settingsBtn" class="glass-btn settings-btn"></button>

    <button id="menuBtn" class="hamburger glass-btn">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div id="menuOverlay"></div>

  <div id="sideMenu" class="side-menu">
    <ul>
      <li><a href="../index.html">首頁</a></li>
      <li><a href="../marine/Marine.html">海洋生態</a></li>
      <li><a href="../trash/Trash.html">海洋垃圾</a></li>
      <li><a href="../goods/Good.html">環保商品</a></li>
      <li><a href="../volunteer/Volunteer.html">志工</a></li>
      <li>
        <a href="../game/Trash-Game.html" class="active">
          <img src="../game.PNG" class="menu-icon">
          海洋消消樂
        </a>
      </li>
    </ul>
  </div>

  <div id="settingsMenu" class="settings-menu">
    <button id="switchModeBtn">切換：關卡 / 無盡</button>
    <button id="exitBtn">退出遊戲</button>
  </div>

  <svg width="0" height="0">
    <filter id="waterWave">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="2" seed="2">
        <animate attributeName="baseFrequency" dur="6s" values="0.01 0.02; 0.02 0.03; 0.01 0.02" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="6" />
    </filter>
  </svg>

  <div id="bg"></div>

  <div id="level-transition">
    <div id="water-bg"></div>
    <div id="transition-text">
      <div id="transition-title"></div>
      <span id="transition-sub"></span>
    </div>
  </div>

  <div id="start-screen">
    <div id="start-title">海洋消消樂</div>
    <h2>🌊 開始清理海洋垃圾！</h2>

    <div id="rules-container">
      <p>規則：</p>
      <ul>
        <li>拖動相鄰的垃圾交換位置，連成 3 個以上即可消除。</li>
        <li>本關目標垃圾會發光，消除指定數量即可過關。</li>
        <li>完成所有關卡，保護海洋！</li>
      </ul>
    </div>

    <button id="start-btn" onclick="startGame()">開始遊戲</button>
  </div>

  <div id="finish-screen" style="display:none">
    <h2>🎉 恭喜完成所有關卡！</h2>
    <div>
      <button onclick="restart()">重玩</button>
      <button onclick="endlessMode()">無盡模式</button>
    </div>
  </div>

  <header>
    <div id="scoreboard">
      <div>分數：<span id="score">0</span></div>
      <div id="mission">
        目標：<span id="target"></span>
        剩餘：<span id="remain"></span>
      </div>
      <div>關卡：<span id="level">1</span></div>
    </div>
  </header>

  <main>
    <div id="grid">
      <div id="overlay"></div>
    </div>
  </main>

  <script>
    const types = [
      './trash-bottle.png',
      './trash-plastic.png',
      './trash-rubber.png',
      './trash-paper.png',
      './trash-metal.png',
      './trash-styrofoam.png'
    ];
    const gridSize = 8;
    
    // ⭐ 將原本固定的 80 改為變數，由 RWD 函式動態修正
    let cellSize = 80; 

    const levels = [
      { target: './trash-bottle.png', goal: 8 },
      { target: './trash-plastic.png', goal: 10 },
      { target: './trash-paper.png', goal: 12 }
    ];

    let currentLevel = 0;
    let remain = 0;
    let grid = [];
    let score = 0;
    let animating = false;
    let drag = null;
    let endless = false;
    let levelClearing = false;

    const gridEl = document.getElementById('grid');
    const overlay = document.getElementById('overlay');
    const finishScreen = document.getElementById('finish-screen');
    const transitionScreen = document.getElementById('level-transition');

    // ⭐ 新增：網格響應式計算函式
    function resizeGameLayout() {
      const screenWidth = window.innerWidth;
      if (screenWidth < 680) {
        // 手機版：留 32px 邊距，其餘均分給 8 個格子
        cellSize = Math.floor((screenWidth - 32) / gridSize);
      } else {
        // 電腦版維持原樣 80px
        cellSize = 80;
      }
      // 將計算好的尺寸推入 CSS :root 變數，完美連動樣式
      document.documentElement.style.setProperty('--cell-size', `${cellSize}px`);
      
      // 同步修正畫面上已存在的垃圾元件位置
      gridEl.querySelectorAll('.emoji').forEach(e => {
        const i = parseInt(e.dataset.row);
        const j = parseInt(e.dataset.col);
        // 置中校正補償
        const offset = (cellSize - (cellSize * 0.85)) / 2;
        e.style.top = (i * cellSize + offset) + 'px';
        e.style.left = (j * cellSize + offset) + 'px';
      });
    }
    window.addEventListener('resize', resizeGameLayout);
    window.addEventListener('DOMContentLoaded', resizeGameLayout);

    // 泡泡產生器（優化為 % 響應式寬度）
    for (let i = 0; i < 20; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.left = `${Math.random() * 100}%`;
      b.style.width = `${Math.random() * 16 + 10}px`;
      b.style.height = b.style.width;
      b.style.animationDuration = `${5 + Math.random() * 4}s`;
      b.style.animationDelay = `${Math.random() * 5}s`;
      gridEl.appendChild(b);
    }

    function startGame() {
      const startScreen = document.getElementById('start-screen');
      startScreen.classList.add('fade-out');
      setTimeout(() => {
        startScreen.style.display = 'none';
      }, 800);

      currentLevel = 0;
      endless = false;
      score = 0;
      document.getElementById('score').textContent = score;
      resizeGameLayout();
      initLevel();
    }

    function randomType() {
      return types[Math.floor(Math.random() * types.length)];
    }

    function initLevel() {
      remain = levels[currentLevel].goal;
      document.getElementById('level').textContent = currentLevel + 1;
      document.getElementById('target').innerHTML = `<img src="${levels[currentLevel].target}" style="width:28px;height:28px;vertical-align:middle;">`;
      document.getElementById('remain').textContent = remain;

      const topLight = Math.max(90, 106 - currentLevel * 8);
      const midBlue = Math.max(60, 160 - currentLevel * 10);
      const deepBlue = Math.max(20, 79 - currentLevel * 8);

      const bgGradient = `linear-gradient(to bottom, rgb(106, ${topLight}, 255) 0%, rgb(43, ${midBlue}, 255) 35%, rgb(11, ${deepBlue}, 163) 100%)`;
      document.body.style.background = bgGradient;
      document.getElementById('bg').style.background = bgGradient;

      gridEl.querySelectorAll('.emoji').forEach(e => e.remove());
      initGrid();
      renderGrid();
    }

    function initGrid() {
      grid = [];
      for (let i = 0; i < gridSize; i++) {
        grid[i] = [];
        for (let j = 0; j < gridSize; j++) {
          let t;
          do { t = randomType(); }
          while (
            (j >= 2 && t === grid[i][j - 1] && t === grid[i][j - 2]) ||
            (i >= 2 && t === grid[i - 1][j] && t === grid[i - 2][j])
          );
          grid[i][j] = t;
        }
      }
    }

    function renderGrid() {
      gridEl.querySelectorAll('.emoji').forEach(e => e.remove());
      for (let i = 0; i < gridSize; i++) {
        for (let j = 0; j < gridSize; j++) {
          createEmoji(i, j, grid[i][j]);
        }
      }
    }

    function createEmoji(i, j, val) {
      const e = document.createElement('div');
      e.className = 'emoji';
      e.dataset.row = i;
      e.dataset.col = j;
      
      const offset = (cellSize - (cellSize * 0.85)) / 2;
      e.style.top = (i * cellSize + offset) + 'px';
      e.style.left = (j * cellSize + offset) + 'px';

      const img = document.createElement('img');
      img.src = val;
      e.appendChild(img);

      if (!endless && val === levels[currentLevel].target)
        e.classList.add('target-glow');

      gridEl.appendChild(e);

      // ⭐ 關鍵修改：將 mousedown 升級為 pointerdown，通用手機與滑鼠
      e.onpointerdown = ev => {
        if (animating) return;
        e.setPointerCapture(ev.pointerId); // ⭐ 鎖定目標，拖曳出格子外也不會中斷觸控
        drag = {
          el: e,
          id: ev.pointerId,
          startX: ev.clientX,
          startY: ev.clientY,
          r: i,
          c: j
        };
      };
    }

    // ⭐ 升級為指標移動事件
    document.onpointermove = ev => {
      if (!drag || drag.id !== ev.pointerId) return;
      drag.el.style.transform = `translate(${ev.clientX - drag.startX}px,${ev.clientY - drag.startY}px)`;
    };

    // ⭐ 升級為指標結束放開事件
    document.onpointerup = ev => {
      if (!drag || drag.id !== ev.pointerId) return;
      const dx = ev.clientX - drag.startX;
      const dy = ev.clientY - drag.startY;
      let r2 = drag.r, c2 = drag.c;

      // ⭐ 判定拖曳交換的閾值，改為動態格子大小的 40%，更符合 RWD 手感
      const threshold = cellSize * 0.4;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > threshold && c2 < 7) c2++;
        if (dx < -threshold && c2 > 0) c2--;
      } else {
        if (dy > threshold && r2 < 7) r2++;
        if (dy < -threshold && r2 > 0) r2--;
      }

      drag.el.style.transform = '';
      if (r2 !== drag.r || c2 !== drag.c) swap(drag.r, drag.c, r2, c2);
      drag = null;
    };

    function swap(r1, c1, r2, c2) {
      animating = true;
      [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
      renderGrid();

      setTimeout(() => {
        if (!checkMatches()) {
          [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
          renderGrid();
          animating = false;
        } else {
          dropAndFill();
        }
      }, 200);
    }

    function checkMatches() {
      let found = false;
      let clear = [];

      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 6; j++) {
          if (grid[i][j] && grid[i][j] == grid[i][j + 1] && grid[i][j] == grid[i][j + 2])
            clear.push([i, j], [i, j + 1], [i, j + 2]);
        }
      }

      for (let j = 0; j < 8; j++) {
        for (let i = 0; i < 6; i++) {
          if (grid[i][j] && grid[i][j] == grid[i + 1][j] && grid[i][j] == grid[i + 2][j])
            clear.push([i, j], [i + 1, j], [i + 2, j]);
        }
      }

      [...new Set(clear.map(JSON.stringify))].map(JSON.parse).forEach(([i, j]) => {
        if (!endless && grid[i][j] === levels[currentLevel]?.target) {
          remain--;
          document.getElementById('remain').textContent = Math.max(remain, 0);
        }
        if (endless && grid[i][j] != '') {
          score += 10;
          document.getElementById('score').textContent = score;
        }
        grid[i][j] = '';
        found = true;

        const e = Array.from(gridEl.querySelectorAll('.emoji')).find(em => {
          return parseInt(em.dataset.row) === i && parseInt(em.dataset.col) === j;
        });

        if (e) e.classList.add('cleared');
      });

      return found;
    }

    function dropAndFill() {
      animating = true;
      document.querySelectorAll('.cleared').forEach(e => e.remove());

      const emojis = Array.from(gridEl.querySelectorAll('.emoji'));

      for (let j = 0; j < gridSize; j++) {
        let empty = 0;

        for (let i = gridSize - 1; i >= 0; i--) {
          if (grid[i][j] == '') empty++;
          else if (empty > 0) {
            const e = emojis.find(em => parseInt(em.dataset.row) === i && parseInt(em.dataset.col) === j);
            grid[i + empty][j] = grid[i][j];
            grid[i][j] = '';

            if (e) {
              e.dataset.row = i + empty;
              const offset = (cellSize - (cellSize * 0.85)) / 2;
              e.style.top = `${(i + empty) * cellSize + offset}px`;
            }
          }
        }

        for (let i = 0; i < empty; i++) {
          const val = randomType();
          grid[i][j] = val;

          const e = document.createElement('div');
          e.className = 'emoji';
          e.dataset.row = i;
          e.dataset.col = j;

          const img = document.createElement('img');
          img.src = val;
          e.appendChild(img);

          const offset = (cellSize - (cellSize * 0.85)) / 2;
          e.style.top = `${-cellSize * (empty - i) + offset}px`;
          e.style.left = `${j * cellSize + offset}px`;

          gridEl.appendChild(e);

          requestAnimationFrame(() => {
            e.style.transition = 'top 0.5s cubic-bezier(.25,.8,.25,1), opacity 0.3s ease';
            e.style.top = `${i * cellSize + offset}px`;
            e.style.opacity = '1';
          });

          // ⭐ 掉落的新元件同樣使用升級版的 pointerdown
          e.onpointerdown = ev => {
            if (animating) return;
            e.setPointerCapture(ev.pointerId);
            drag = {
              el: e,
              id: ev.pointerId,
              startX: ev.clientX,
              startY: ev.clientY,
              r: i,
              c: j
            };
          };

          if (!endless && val === levels[currentLevel].target)
            e.classList.add('target-glow');
        }
      }

      setTimeout(() => {
        if (checkMatches()) {
          dropAndFill();
        } else {
          animating = false;
          if (!endless && remain <= 0 && !levelClearing) {
            setTimeout(() => {
              nextLevel();
            }, 400);
          }
        }
      }, 350);
    }

    function nextLevel() {
      if (levelClearing) return;
      levelClearing = true;

      const transition = document.getElementById('level-transition');
      const textBox = document.getElementById('transition-text');
      const title = document.getElementById('transition-title');
      const sub = document.getElementById('transition-sub');

      title.textContent = `第 ${currentLevel + 1} 關 清理完成`;
      sub.textContent = "海洋水質提升中... 🌊";

      textBox.style.opacity = '0';
      textBox.style.transform = 'translateY(30px) scale(0.95)';
      transition.style.opacity = '1';

      transition.style.transition = 'transform 1.4s cubic-bezier(0.33, 0.96, 0.64, 1)';
      transition.style.transform = 'translateY(0)';

      setTimeout(() => {
        textBox.style.opacity = '1';
        textBox.style.transform = 'translateY(0) scale(1)';
      }, 700);

      setTimeout(() => {
        transition.style.transition = 'opacity .8s ease';
        transition.style.opacity = '0';

        if (currentLevel >= levels.length - 1) {
          finishScreen.style.display = 'flex';
        } else {
          currentLevel++;
          initLevel();
        }

        setTimeout(() => {
          transition.style.transition = 'none';
          transition.style.transform = 'translateY(100%)';
          transition.style.opacity = '1';
          levelClearing = false;
        }, 900);

      }, 2300);
    }

    function restart() {
      finishScreen.style.display = 'none';
      currentLevel = 0;
      endless = false;
      score = 0;
      document.getElementById('score').textContent = score;
      initLevel();
    }

    function endlessMode() {
      finishScreen.style.display = 'none';
      endless = true;
      score = 0;
      document.getElementById('score').textContent = score;
      currentLevel = 0;
      remain = 9999;
      document.getElementById('target').textContent = '隨機';
      document.getElementById('remain').textContent = '∞';

      gridEl.querySelectorAll('.emoji').forEach(e => e.remove());
      initGrid();
      renderGrid();
    }

    // UI 控制代碼維持原樣...
    const menuBtn = document.getElementById('menuBtn');
    const sideMenu = document.getElementById('sideMenu');
    const menuOverlay = document.getElementById('menuOverlay');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');
    const exitBtn = document.getElementById('exitBtn');
    const switchModeBtn = document.getElementById('switchModeBtn');

    menuBtn.addEventListener('click', () => {
      menuBtn.classList.toggle('active');
      sideMenu.classList.toggle('open');
      menuOverlay.style.display = sideMenu.classList.contains('open') ? 'block' : 'none';
    });

    menuOverlay.addEventListener('click', () => {
      sideMenu.classList.remove('open');
      menuBtn.classList.remove('active');
      menuOverlay.style.display = 'none';
    });

    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsMenu.classList.toggle('show');
    });

    settingsMenu.addEventListener('click', (e) => { e.stopPropagation(); });

    document.addEventListener('click', () => { settingsMenu.classList.remove('show'); });

    switchModeBtn.addEventListener('click', () => {
      settingsMenu.classList.remove('show');
      if (!endless) { endlessMode(); } 
      else {
        endless = false;
        currentLevel = 0;
        score = 0;
        document.getElementById('score').textContent = score;
        initLevel();
      }
    });

    exitBtn.addEventListener('click', () => {
      settingsMenu.classList.remove('show');
      const startScreen = document.getElementById('start-screen');
      startScreen.style.display = 'flex';
      setTimeout(() => { startScreen.classList.remove('fade-out'); }, 10);
    });
  </script>
</body>
